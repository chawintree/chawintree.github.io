<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Chawin Tree</title>
    <meta name="description" content="Essays and thoughts from Chawin Tree.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Josefin+Sans:wght@600;700&family=Source+Sans+3:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>

    <aside class="vertical-spine">
        <span class="vertical-label accent-text">WRITINGS</span>
    </aside>

    <div class="editorial-container">

        <header class="page-header">
            <h1 class="title-large">CHAWIN TREE</h1>
            <p class="subtitle">— Blog —</p>
        </header>

        <nav>
            <a href="/">Home</a>
            <a href="/blog" class="active">Blog</a>
            <div class="nav-dropdown">
                <span>More</span>
                <div class="dropdown-menu">
                    <a href="/library">Library</a>
                    <a href="/games">Games</a>
                </div>
            </div>
            <a href="/about">About</a>
        </nav>

        <main class="content-single">
            <ul class="post-list" id="post-list">
                <li class="loading">Loading posts...</li>
            </ul>
        </main>

        <footer class="site-footer">
            <p>© 2026 Chawin Tree</p>
        </footer>

    </div>

    <script>
        fetch('/posts/manifest.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('post-list');
                
                if (posts.length === 0) {
                    container.innerHTML = '<li class="loading">No posts yet.</li>';
                    return;
                }
                
                container.innerHTML = posts.map(post => {
                    const date = new Date(post.date);
                    const dateStr = date.toLocaleDateString('en-GB', { 
                        day: '2-digit', 
                        month: 'short',
                        year: 'numeric'
                    }).toUpperCase();
                    
                    return `
                        <li class="post-item">
                            <span class="date-text">${dateStr}</span>
                            <h2 class="title-medium"><a href="/post?post=${post.slug}">${post.title}</a></h2>
                        </li>
                    `;
                }).join('');
            })
            .catch(error => {
                document.getElementById('post-list').innerHTML = 
                    '<li class="loading">Unable to load posts.</li>';
                console.error('Error loading posts:', error);
            });
    </script>

</body>
</html>
